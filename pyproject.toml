[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epub-ai-translator"
version = "0.3.0"
description = "English-to-Persian EPUB translator web app (FastAPI + DeepSeek, BYOK)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "ebooklib",
    "beautifulsoup4",
    "lxml",
    "openai",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.urls]
Homepage = "https://github.com/Retro-Zero/epub-ai-translator"
Repository = "https://github.com/Retro-Zero/epub-ai-translator"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::bs4.XMLParsedAsHTMLWarning",
]
